scope: >-
  Life360 publishes no public API, no OpenAPI and no developer portal, so the
  usual spec-derived conformance signals (OAuth2/OIDC schemes, RFC 9457 problem
  details, pagination, idempotency) are not assessable. What follows is limited
  to the cross-cutting standards Life360 does publish on its web surface.
standards:
- id: rfc9116-security-txt
  conforms: true
  evidence: >-
    /.well-known/security.txt served with Contact, Preferred-Languages,
    Canonical and Hiring fields.
  caveat: >-
    The Expires field reads 2022-12-31T23:59:00.000Z — the file is expired per
    RFC 9116 §2.5.5 and should be refreshed.
- id: ai-plugin-manifest-v1
  conforms: partial
  evidence: >-
    /.well-known/ai-plugin.json is a well-formed schema_version v1 manifest with
    name_for_model, description_for_model, auth (none), logo_url and
    legal_info_url.
  caveat: >-
    api.url points at https://www.life360.com/openapi-spec.json, which returns
    404. The manifest advertises a machine-readable contract that does not
    resolve, so no agent can actually bind to it.
- id: llms-txt
  conforms: true
  evidence: >-
    /llms.txt served at the root in llms.txt form (H1, blockquote summary, then
    sectioned link lists for App Features, Products, Plans & Pricing, Download,
    Policies, Support, Company and Optional).
- id: content-signals
  conforms: true
  evidence: >-
    robots.txt carries "Content-Signal: ai-train=no, ai-input=yes, search=yes"
    plus explicit Allow blocks for GPTBot, ChatGPT-User, ClaudeBot,
    PerplexityBot and Google-Extended.
- id: tls-in-transit
  conforms: true
  evidence: >-
    TLSv1.3 with HSTS (max-age 31536000) observed on www.life360.com; the help
    center states Life360 uses "industry-standard TLS encryption for data in
    transit, and AES for data at rest, as per our Data Management Policy".
- id: oauth2
  conforms: false
  evidence: >-
    No /.well-known/oauth-authorization-server, no
    /.well-known/openid-configuration, no documented OAuth surface.
- id: openid-connect
  conforms: false
  evidence: /.well-known/openid-configuration returned 404.
- id: rfc9457-problem-details
  conforms: false
