aid: life360
name: Life360
description: >-
  Life360 is a family safety platform built around a location-sharing mobile app
  for iOS and Android, offering real-time member location, Place Alerts, location
  history, driving safety scores and trip history, crash detection, SOS alerts
  and emergency dispatch, plus digital safety features such as identity theft
  protection and dark web monitoring. Its hardware line, following the
  acquisitions of Tile and Jiobit, spans Tile Mate, Pro, Slim and Sticker
  Bluetooth item trackers and a cellular GPS pet tracker, sold direct and through
  Amazon, Best Buy, Target and Walmart. The service is sold as Free, Silver, Gold
  and Platinum membership tiers. Life360 publishes no public developer API, no
  OpenAPI, no SDKs and no developer portal — its only machine-readable surface is
  an agent-facing one (llms.txt, an ai-plugin manifest whose advertised OpenAPI
  does not resolve, and Content-Signal directives in robots.txt). This profile is
  maintained in the API Evangelist network for company discovery and monitoring.
